<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rushes formats mockup</title>
<style>
:root{color-scheme:dark;--bg:#0c0d0f;--app:#141518;--raised:#1c1e22;--hover:#25282d;--press:#2d3036;--line:#26282d;--line-2:#34373d;--text:#eeeef0;--text-2:#a3a6ad;--text-3:#70737a;--accent:#7c93ff;--accent-2:#9eaeff;--on-accent:#0b1026;--accent-soft:rgba(124,147,255,.14);--todo:#f5b740;--todo-soft:rgba(245,183,64,.14);--done:#4cc38a;--vo:#4fd1c5;--music:#a78bfa;--r:10px;--r-lg:14px;--mono:ui-monospace,"SF Mono",Menlo,monospace}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg)}
body{color:var(--text);font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.demo{display:flex;gap:10px;align-items:center;padding:10px 20px;border-bottom:1px solid var(--line);background:#0a0b0d;color:var(--text-2);font-size:15px;flex-wrap:wrap}
.demo b{color:var(--text)}
.demo button{padding:6px 12px;border:1px solid var(--line-2);border-radius:999px;color:var(--text-2)}
.demo button[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-2)}
.app{max-width:1280px;margin:0 auto;background:var(--app);min-height:100vh}
header{display:flex;align-items:center;gap:14px;padding:12px 20px;border-bottom:1px solid var(--line)}
.logo{width:28px;height:28px;border-radius:8px;background:var(--accent-soft);display:grid;place-items:center;color:var(--accent)}
.crumb{color:var(--text-2)} .crumb b{color:var(--text);font-weight:600}
.pill{padding:3px 12px;border:1px solid var(--line-2);border-radius:999px;color:var(--text-2)}
.sp{flex:1}
.send{background:var(--accent);color:var(--on-accent);padding:8px 16px;border-radius:12px;font-weight:600}
/* the new control */
.fmts{display:inline-flex;gap:2px;padding:3px;background:var(--bg);border:1px solid var(--line);border-radius:999px}
.fmts [role=radio]{display:inline-flex;align-items:center;gap:8px;padding:4px 12px;border-radius:999px;color:var(--text-2);min-height:30px}
.fmts [role=radio]:hover{background:var(--hover);color:var(--text)}
.fmts [role=radio][aria-checked=true]{background:var(--accent);color:var(--on-accent);font-weight:600}
.fmts [role=radio][aria-disabled=true]{color:var(--text-3);cursor:not-allowed;background:none}
.fmts .shape{display:inline-block;border:1.5px solid currentColor;border-radius:2px}
.fmts .n{font-size:15px;background:var(--todo-soft);color:var(--todo);border-radius:999px;padding:0 7px;line-height:20px;font-variant-numeric:tabular-nums}
.fmts [aria-checked=true] .n{background:rgba(11,16,38,.18);color:var(--on-accent)}
.warn{color:var(--todo);margin-left:2px}
nav.tabs{display:flex;gap:6px;padding:0 20px;border-bottom:1px solid var(--line);color:var(--text-3)}
nav.tabs span{padding:12px 14px}
nav.tabs .on{color:var(--text);border-bottom:2px solid var(--accent)}
main{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:20px;padding:20px}
.stage{background:var(--bg);border:1px solid var(--line);border-radius:var(--r-lg);height:520px;display:grid;place-items:center;position:relative;overflow:hidden}
.frame{background:linear-gradient(160deg,#1b2140,#0e1226 60%,#171a33);border:1px solid var(--line-2);border-radius:6px;position:relative;transition:width .16s,height .16s;display:grid;place-items:center;color:var(--text-2)}
.frame .big{font-size:40px;font-weight:700;letter-spacing:-.02em;color:#c9d2ff}
.frame .lbl{position:absolute;left:10px;top:8px;font-family:var(--mono);font-size:15px;color:var(--text-2)}
.frame .box{position:absolute;border:2px solid var(--todo);border-radius:4px;background:var(--todo-soft)}
.tl{margin-top:14px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 16px}
.tl .row{display:flex;justify-content:space-between;font-family:var(--mono);color:var(--text-2);margin-bottom:8px}
.track{position:relative;height:44px;background:var(--raised);border-radius:8px}
.wave{position:absolute;inset:10px 0;opacity:.35;background:repeating-linear-gradient(90deg,var(--text-3) 0 2px,transparent 2px 6px);mask:linear-gradient(#000,#000)}
.play{position:absolute;top:0;bottom:0;width:2px;background:var(--text);left:34%}
.m{position:absolute;top:-6px;width:14px;height:14px;border-radius:50%;transform:translateX(-50%)}
.m.dot{background:var(--todo)}
.m.ring{border:2px solid var(--accent-2);background:var(--app)}
.m.dim{display:none}
aside{display:flex;flex-direction:column;gap:12px}
.card{background:var(--raised);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.card h3{margin:0 0 8px;font-size:15px;font-weight:600;color:var(--text-2);display:flex;align-items:center;gap:8px}
.note{padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--app);display:grid;gap:4px}
.note .meta{display:flex;gap:8px;align-items:center;color:var(--text-3);font-family:var(--mono)}
.tag{padding:0 8px;border-radius:999px;border:1px solid var(--line-2);color:var(--text-2);font-size:15px;line-height:22px;font-family:var(--mono)}
.tag.all{border-color:var(--accent);color:var(--accent-2);background:var(--accent-soft)}
.note.hide{display:none}
.composer textarea{width:100%;min-height:72px;background:var(--bg);border:1px solid var(--line-2);border-radius:var(--r);padding:10px 12px;color:var(--text);resize:vertical}
.scope{display:inline-grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px;padding:3px;background:var(--bg);border:1px solid var(--line);border-radius:999px;margin-bottom:10px}
.scope [role=radio]{padding:4px 14px;border-radius:999px;color:var(--text-2);white-space:nowrap;display:inline-flex;gap:8px;align-items:center}
.scope [aria-checked=true]{background:var(--accent-soft);color:var(--accent-2);box-shadow:inset 0 0 0 1px var(--accent)}
.scope [aria-disabled=true]{color:var(--text-3);cursor:not-allowed}
.hint{color:var(--text-3);margin:8px 0 0}
.other{display:flex;justify-content:space-between;align-items:center;color:var(--text-2);padding:8px 12px;border:1px dashed var(--line-2);border-radius:var(--r)}
.other[hidden]{display:none}
.other button{color:var(--accent-2)}
.tip{position:absolute;z-index:5;background:#000;border:1px solid var(--line-2);border-radius:8px;padding:8px 12px;max-width:340px;color:var(--text);display:none}
.tip code{font-family:var(--mono);color:var(--accent-2)}
.tip button{margin-top:6px;border:1px solid var(--line-2);border-radius:8px;padding:2px 10px;color:var(--accent-2)}
</style>
</head>
<body>
<div class="demo" role="group" aria-label="Mockup controls">
  <b>Mockup:</b>
  <span>this cut has</span>
  <button data-set="4" aria-pressed="true">4 formats (v1)</button>
  <button data-set="3" aria-pressed="false">3 formats (v2, no 4:5)</button>
  <button data-set="1" aria-pressed="false">1 format</button>
  <span style="margin-left:12px">Click the chips, the note switch, and a marker.</span>
</div>

<div class="app">
  <header>
    <div class="logo" aria-hidden="true">▶</div>
    <span class="crumb"><b>Lumen launch film</b> <span style="font-family:var(--mono);color:var(--text-3)">k7m2q9ab</span> / Lumen launch film</span>
    <span class="pill">Picture</span><span class="pill" id="ver">v1</span>
    <div id="fmts" class="fmts" role="radiogroup" aria-label="Format"></div>
    <span class="sp"></span>
    <button class="send">Send to agent</button>
  </header>
  <nav class="tabs"><span>Script</span><span class="on">Picture</span><span>Voiceover</span><span>Music</span><span>Sound effects</span><span>Mix</span><span>Assets</span></nav>

  <main>
    <section>
      <div class="stage"><div class="frame" id="frame"><span class="lbl" id="flbl">9:16</span><span class="big">Lumen launch</span><div class="box" id="box" style="left:14%;top:12%;width:34%;height:14%" hidden></div></div></div>
      <div class="tl">
        <div class="row"><span id="time">0:02.7</span><span>0:08.0</span></div>
        <div class="track"><div class="wave"></div><div class="play"></div><div id="markers"></div></div>
      </div>
    </section>

    <aside>
      <div class="card composer">
        <h3>New note at <span style="font-family:var(--mono);color:var(--text)">0:02.7</span></h3>
        <div id="scope" class="scope" role="radiogroup" aria-label="This note applies to"></div>
        <textarea placeholder="What should change?" aria-label="Note"></textarea>
        <p class="hint" id="scopeHint"></p>
      </div>
      <div class="card">
        <h3>Notes <span class="tag" id="vcount"></span></h3>
        <div id="notes" style="display:grid;gap:8px"></div>
      </div>
      <div class="other" id="other" hidden><span id="otherText"></span><button id="otherBtn">Show</button></div>
    </aside>
  </main>
</div>
<div class="tip" id="tip"></div>

<script>
const RATIOS = {"9:16":[9,16],"4:5":[4,5],"1:1":[1,1],"16:9":[16,9]};
const ORDER = ["9:16","4:5","1:1","16:9"];
const NOTES = [
  {t:"0:00.4", at:5,  fmt:"all",  text:"Drop this first sound."},
  {t:"0:01.9", at:24, fmt:"9:16", text:"Logo sits too close to the top edge."},
  {t:"0:02.7", at:34, fmt:"16:9", text:"Rows land late against the beat on wide."},
  {t:"0:04.3", at:54, fmt:"all",  text:"Hold the last row half a second longer."},
  {t:"0:06.8", at:85, fmt:"4:5",  text:"End card cropped at the bottom."},
];
let have = ["9:16","4:5","1:1","16:9"], prevHad = have.slice(), cur = "9:16", scope = "this", hasBox = false;

const $ = (s) => document.querySelector(s);
function shape(r){const [w,h]=RATIOS[r];const k=14/Math.max(w,h);return `<span class="shape" style="width:${Math.round(w*k)}px;height:${Math.round(h*k)}px"></span>`}
function visible(n){return n.fmt==="all"||n.fmt===cur}
function count(r){return NOTES.filter(n=>n.fmt==="all"||n.fmt===r).length}

function renderFmts(){
  const single = have.length===1;
  const chips = ORDER.filter(r=>prevHad.includes(r)||have.includes(r));
  $("#fmts").innerHTML = chips.map(r=>{
    const on = have.includes(r), sel = r===cur;
    const dis = single || !on;
    return `<button role="radio" aria-checked="${sel}" ${dis?'aria-disabled="true"':''} data-r="${r}" tabindex="${sel?0:-1}" aria-label="${r}${on?(count(r)?`, ${count(r)} open notes`:''):', not in this version'}">${shape(r)}<span>${r}</span>${on&&!single&&count(r)?`<span class="n">${count(r)}</span>`:""}</button>`;
  }).join("");
  $("#fmts").querySelectorAll("button").forEach(b=>{
    b.onclick=()=>{ if(b.getAttribute("aria-disabled")==="true"){return} cur=b.dataset.r; render(); };
    b.onmouseenter=(e)=>showTip(b);
    b.onmouseleave=hideTip;
    b.onfocus=()=>showTip(b); b.onblur=hideTip;
  });
}
function showTip(b){
  const dis=b.getAttribute("aria-disabled")==="true"; if(!dis) return;
  const t=$("#tip"), r=b.getBoundingClientRect();
  t.innerHTML = have.length===1
    ? `One format. Your agent can add more with <code>rushes_add_format</code>.<br><button>Copy a prompt for your agent</button>`
    : `Not in ${$("#ver").textContent}.`;
  t.style.display="block"; t.style.left=Math.min(r.left, innerWidth-360)+"px"; t.style.top=(r.bottom+8+scrollY)+"px";
}
function hideTip(){ $("#tip").style.display="none" }

function renderFrame(){
  const [w,h]=RATIOS[cur], box=$(".stage").getBoundingClientRect();
  const maxW=box.width-40, maxH=box.height-40, k=Math.min(maxW/w,maxH/h);
  const f=$("#frame"); f.style.width=Math.round(w*k)+"px"; f.style.height=Math.round(h*k)+"px";
  $("#flbl").textContent=cur; $("#box").hidden=!hasBox;
}
function renderScope(){
  const single=have.length===1;
  $("#scope").style.display=single?"none":"inline-grid";
  if(!single){
    $("#scope").innerHTML=`
      <button role="radio" aria-checked="${scope==='this'}" data-s="this">${shape(cur)} This format</button>
      <button role="radio" aria-checked="${scope==='all'}" data-s="all" ${hasBox?'aria-disabled="true" title="A drawn box belongs to one frame, so this note stays on this format."':''}>All formats</button>`;
    $("#scope").querySelectorAll("button").forEach(b=>b.onclick=()=>{ if(b.getAttribute("aria-disabled")==="true")return; scope=b.dataset.s; renderScope(); });
  }
  $("#scopeHint").textContent = single ? "Saved for the whole cut." :
    hasBox ? `A drawn box fixes this note to ${cur}.` :
    scope==="this" ? `Shows only while you're viewing ${cur}.` : "Shows on every format.";
}
function renderNotes(){
  const vis=NOTES.filter(n=>visible(n));
  $("#vcount").textContent=vis.length+" for "+(have.length===1?"this cut":cur);
  $("#notes").innerHTML=vis.map(n=>`<div class="note"><div class="meta"><span>${n.t}</span><span class="tag ${n.fmt==='all'?'all':''}">${n.fmt==='all'?'All':n.fmt}</span></div><div>${n.text}</div></div>`).join("");
  $("#markers").innerHTML=NOTES.map(n=>`<span class="m ${n.fmt==='all'?'ring':'dot'} ${visible(n)?'':'dim'}" style="left:${n.at}%" title="${n.t}"></span>`).join("");
  const hid=NOTES.filter(n=>!visible(n));
  $("#other").hidden=have.length===1||hid.length===0;
  $("#otherText").textContent=`Other formats (${hid.length})`;
  $("#otherBtn").textContent="Show";
}
function render(){ renderFmts(); renderFrame(); renderScope(); renderNotes(); }

document.querySelectorAll(".demo [data-set]").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".demo [data-set]").forEach(x=>x.setAttribute("aria-pressed","false")); b.setAttribute("aria-pressed","true");
  const n=b.dataset.set;
  if(n==="4"){have=["9:16","4:5","1:1","16:9"];prevHad=have.slice();$("#ver").textContent="v1"}
  if(n==="3"){have=["9:16","1:1","16:9"];prevHad=["9:16","4:5","1:1","16:9"];$("#ver").textContent="v2"}
  if(n==="1"){have=["16:9"];prevHad=have.slice();$("#ver").textContent="v1"}
  if(!have.includes(cur)) cur=have[0];
  render();
});
$("#frame").addEventListener("dblclick",()=>{hasBox=!hasBox; if(hasBox)scope="this"; render()});
document.addEventListener("keydown",(e)=>{
  if(e.target.matches("textarea,input")) return;
  const list=ORDER.filter(r=>have.includes(r)); const i=list.indexOf(cur);
  if(e.key==="["&&i>0){cur=list[i-1];render()} if(e.key==="]"&&i<list.length-1){cur=list[i+1];render()}
});
addEventListener("resize",renderFrame);
render();
</script>
</body>
</html>
