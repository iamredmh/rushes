<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rushes start-here mockup</title>
<style>
:root{color-scheme:dark;--bg:#0c0d0f;--app:#141518;--raised:#1c1e22;--hover:#25282d;--press:#2d3036;--line:#26282d;--line-2:#34373d;--text:#eeeef0;--text-2:#a3a6ad;--text-3:#70737a;--accent:#7c93ff;--accent-2:#9eaeff;--on-accent:#0b1026;--accent-soft:rgba(124,147,255,.14);--todo:#f5b740;--todo-soft:rgba(245,183,64,.14);--done:#4cc38a;--done-soft:rgba(76,195,138,.14);--flag:#f0716b;--r:10px;--r-lg:14px;--mono:ui-monospace,"SF Mono",Menlo,monospace}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg)}
body{color:var(--text);font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
textarea,input{font:inherit;color:var(--text)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{display:block;flex:none}
.demo{padding:10px 20px;border-bottom:1px solid var(--line);background:#0a0b0d;color:var(--text-2);display:grid;gap:8px}
.demo .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.demo b{color:var(--text)}
.demo button{padding:5px 12px;border:1px solid var(--line-2);border-radius:999px;color:var(--text-2)}
.demo button[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-2)}
.demo .what{color:var(--text);border-left:2px solid var(--todo);padding-left:10px;max-width:1100px}
.app{max-width:1280px;margin:0 auto;background:var(--app);min-height:100vh;position:relative}
header{display:flex;align-items:center;gap:14px;padding:12px 20px;border-bottom:1px solid var(--line)}
.logo{width:28px;height:28px;border-radius:8px;background:var(--accent-soft);display:grid;place-items:center;color:var(--accent)}
.crumb{color:var(--text-2)} .crumb b{color:var(--text);font-weight:600} .crumb .id{font-family:var(--mono);color:var(--text-3)}
.pill{padding:3px 14px;border:1px solid var(--line-2);border-radius:999px;color:var(--text-2);display:inline-flex;gap:8px;align-items:center}
.pill .v{font-family:var(--mono);color:var(--accent-2)}
.sp{flex:1}
.ibtn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--text-2)}
.ibtn:hover{background:var(--hover);color:var(--text)}
.obtn{height:36px;padding:0 14px;border:1px solid var(--line-2);border-radius:12px;display:inline-flex;gap:8px;align-items:center;color:var(--text-2);position:relative}
.obtn:hover{background:var(--hover);color:var(--text)}
.dot-o{position:absolute;right:-3px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--todo)}
.send{height:36px;background:var(--accent);color:var(--on-accent);padding:0 16px;border-radius:12px;font-weight:600;display:inline-flex;align-items:center;gap:10px}
.send .n{background:rgba(11,16,38,.22);border-radius:999px;min-width:24px;height:24px;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.send[disabled]{background:var(--raised);color:var(--text-3);cursor:default}
/* the new header mark */
.chip{height:36px;padding:0 14px;border:1px solid var(--line-2);border-radius:999px;display:inline-flex;gap:10px;align-items:center;color:var(--text-2)}
.chip:hover{background:var(--hover)}
.chip.ready{border-color:var(--done);color:var(--done);background:var(--done-soft);font-weight:600}
.trio{display:inline-flex;gap:6px}
.trio i{width:12px;height:12px;border-radius:50%;border:2px solid var(--text-3);display:block;position:relative}
.trio i.ok{background:var(--done);border-color:var(--done)}
.trio i.part{border-color:var(--todo);background:linear-gradient(90deg,var(--todo) 50%,transparent 50%)}
nav.tabs{display:flex;gap:2px;padding:0 12px;border-bottom:1px solid var(--line);overflow:auto}
.tab{display:inline-flex;gap:8px;align-items:center;padding:14px 14px;color:var(--text-2);border-bottom:2px solid transparent;white-space:nowrap}
.tab:hover{color:var(--text)}
.tab.on{color:var(--text);border-bottom-color:var(--accent)}
.tab.locked{color:var(--text-3)}
.tab .od{width:8px;height:8px;border-radius:50%;background:var(--todo)}
.tab.fresh{animation:pop .9s ease}
@keyframes pop{0%{background:var(--accent-soft)}100%{background:none}}
.col{max-width:900px;margin:0 auto;padding:28px 20px 60px}
h1.pg{margin:0 0 4px;font-size:24px;font-weight:600;display:flex;gap:14px;align-items:baseline}
h1.pg small{font-size:15px;color:var(--text-3);font-weight:400}
.heads{display:grid;grid-template-columns:120px 1fr 1fr 40px;gap:16px;padding:14px 20px 8px;color:var(--text-3)}
.rowc{background:var(--raised);border-radius:var(--r-lg);padding:16px 20px;display:grid;grid-template-columns:120px 1fr 1fr 40px;gap:16px;margin-bottom:12px;border:1.5px solid transparent;align-items:start}
.rowc.changed{border-color:var(--todo)}
.rowc .lab{font-weight:600;padding-top:6px}
.rowc .cur{color:var(--text-2);padding-top:6px;display:grid;gap:6px}
.rowc .cur .k{color:var(--text-3)}
.rowc .yours{display:grid;gap:8px}
.rowc textarea,.rowc input[type=text],.rowc input[type=number]{width:100%;background:var(--app);border:1px solid transparent;border-radius:var(--r);padding:8px 12px;resize:none;min-height:40px;line-height:1.5}
.rowc textarea:focus,.rowc input:focus{outline:none;border-color:var(--accent)}
.rowc .sub{display:grid;grid-template-columns:70px 1fr;gap:8px;align-items:start}
.rowc .sub span{color:var(--text-3);padding-top:8px}
.numline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.numline input{width:76px !important}
.fm{display:inline-flex;gap:8px;align-items:center;padding:4px 12px;border:1px solid var(--line-2);border-radius:999px;color:var(--text-2);min-height:32px}
.fm[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-2)}
.fm .shape{display:inline-block;border:1.5px solid currentColor;border-radius:2px}
.rowc .rv{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--text-2);margin-top:2px}
.rowc .rv:hover{background:var(--hover);color:var(--text)}
.rowc .rv[hidden]{display:none}
.refs{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:20px 0 6px;padding:0 4px}
.ref{display:inline-flex;gap:8px;align-items:center;padding:4px 6px 4px 12px;border:1px solid var(--line-2);border-radius:999px;color:var(--text-2);font-family:var(--mono)}
.ref button{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:var(--text-3)}
.ref button:hover{background:var(--hover);color:var(--text)}
.foot{display:flex;align-items:center;gap:14px;margin-top:22px;padding:0 4px}
.approve{height:40px;padding:0 18px;border-radius:12px;background:var(--raised);border:1px solid var(--line-2);display:inline-flex;gap:10px;align-items:center;font-weight:600}
.approve:hover{background:var(--hover)}
.approve.is{background:var(--done-soft);border-color:var(--done);color:var(--done)}
.mark{display:inline-flex;gap:8px;align-items:center;color:var(--done)}
/* script rows */
.scr{background:var(--raised);border-radius:var(--r-lg);padding:16px 20px;margin-bottom:12px;border:1.5px solid transparent;display:grid;grid-template-columns:110px 1fr 1fr;gap:16px}
.scr.changed{border-color:var(--todo)}
.scr .id b{display:block}
.scr .id span{font-family:var(--mono);color:var(--text-2)}
.scr .cur{color:var(--text-2);padding-top:2px}
.scr textarea{width:100%;background:var(--app);border:1px solid transparent;border-radius:var(--r);padding:10px 14px;resize:none;min-height:72px}
.scr textarea:focus{outline:none;border-color:var(--accent)}
.scr .low{grid-column:1/-1;display:flex;gap:12px;align-items:center}
.fit{width:100px;height:6px;border-radius:3px;background:var(--app);overflow:hidden;flex:none}
.fit i{display:block;height:100%;border-radius:3px}
.scr .dir{flex:1;background:var(--app);border:1px solid transparent;border-radius:var(--r);padding:8px 14px;color:var(--text)}
.scr .dir::placeholder{color:var(--text-3)}
.tick{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--text-2)}
.tick:hover{background:var(--hover);color:var(--text)}
.tick.on{color:var(--done);background:var(--done-soft)}
.tick.flag.on{color:var(--flag);background:rgba(240,113,107,.14)}
/* two-column stages */
.split{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:20px;padding:24px 20px 40px}
.stage{background:var(--bg);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;position:relative;aspect-ratio:16/9;width:min(100%,620px)}
.stage svg.art{width:100%;height:100%}
.stage .tagbr{position:absolute;right:14px;bottom:12px;background:rgba(0,0,0,.72);border-radius:8px;padding:2px 10px;font-family:var(--mono);color:#fff}
.stage .st{position:absolute;left:14px;top:12px}
.cap{margin:14px 2px 0;display:grid;gap:4px}
.cap h2{margin:0;font-size:20px;font-weight:600;display:flex;gap:12px;align-items:center}
.small{font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);font-weight:600}
.cap p{margin:0;color:var(--text-2);max-width:62ch}
.strip{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-top:18px}
.card{background:var(--raised);border:1.5px solid var(--line);border-radius:12px;padding:6px;text-align:left;position:relative;display:block;width:100%}
.card:hover{background:var(--hover)}
.card.sel{border-color:var(--accent);background:var(--accent-soft)}
.card .th{border-radius:7px;overflow:hidden;aspect-ratio:16/9;display:block}
.card .th svg{width:100%;height:100%}
.card .m{display:flex;justify-content:space-between;padding:6px 4px 0;font-family:var(--mono);color:var(--text-2)}
.card .nm{padding:0 4px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .ck{position:absolute;right:10px;top:10px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.6);color:var(--text-3)}
.card .ck.on{background:var(--done);color:#07140d}
.card .ck.flag{background:var(--flag);color:#1a0706}
.total{margin-top:16px;display:flex;gap:14px;align-items:center;color:var(--text-2);font-family:var(--mono)}
.total .bar{flex:1;height:6px;border-radius:3px;background:var(--raised);overflow:hidden}
.total .bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.side{background:var(--raised);border:1px solid var(--line);border-radius:var(--r-lg);display:flex;flex-direction:column;max-height:calc(100vh - 220px);min-height:480px;position:sticky;top:12px}
.side .hd{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;font-weight:600}
.seg{display:inline-flex;gap:2px;padding:3px;background:var(--bg);border:1px solid var(--line);border-radius:999px;font-weight:400}
.seg span{padding:2px 12px;border-radius:999px;color:var(--text-2)}
.seg .on{background:var(--hover);color:var(--text)}
.nlist{flex:1;overflow:auto;padding:0 8px;display:grid;align-content:start;gap:2px}
.note{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:12px 10px;border-radius:10px;border-left:3px solid transparent}
.note.sel{background:var(--hover);border-left-color:var(--accent)}
.note .c{width:24px;height:24px;border-radius:50%;border:2px solid var(--todo);margin-top:2px;display:grid;place-items:center;color:#07140d}
.note .c.on{background:var(--done);border-color:var(--done)}
.note .t{font-family:var(--mono);color:var(--accent-2)}
.note .s{color:var(--text-3)}
.note .tx{margin-top:2px}
.comp{padding:12px;border-top:1px solid var(--line)}
.comp .box{background:var(--app);border-radius:12px;padding:10px 12px 10px;display:grid}
.comp textarea{background:none;border:0;resize:none;min-height:56px;outline:none}
.comp textarea::placeholder{color:var(--text-3)}
.comp .go{justify-self:end;width:36px;height:36px;border-radius:10px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center}
/* player */
.xport{display:flex;align-items:center;gap:14px;margin-top:14px;font-family:var(--mono);color:var(--text-2)}
.xport .pb{width:44px;height:44px;border-radius:12px;background:var(--raised);display:grid;place-items:center;color:var(--text)}
.tline{margin-top:12px;height:46px;background:var(--bg);border:1px solid var(--line);border-radius:10px;position:relative;overflow:hidden;display:grid;grid-template-columns:3fr 5fr 6fr 4fr 6fr 5fr}
.tline i{border-right:1px solid var(--line-2)}
.tline b{position:absolute;top:0;bottom:0;left:3%;width:2px;background:#fff}
.tline em{position:absolute;top:50%;width:12px;height:12px;border-radius:50%;background:var(--todo);transform:translate(-50%,-50%)}
/* locked */
.lock{max-width:560px;margin:0 auto;padding:90px 20px;text-align:center;display:grid;gap:14px;justify-items:center}
.lock .big{width:64px;height:64px;border-radius:18px;background:var(--raised);display:grid;place-items:center;color:var(--text-2);position:relative}
.lock .big .lk{position:absolute;right:-6px;bottom:-6px;width:26px;height:26px;border-radius:50%;background:var(--bg);border:1px solid var(--line-2);display:grid;place-items:center;color:var(--text-3)}
.lock h2{margin:6px 0 0;font-size:22px;font-weight:600}
.lock p{margin:0;color:var(--text-2)}
.lock .un{color:var(--text-2);border:1px dashed var(--line-2);border-radius:var(--r);padding:8px 14px}
.cp{height:40px;padding:0 18px;border-radius:12px;background:var(--raised);border:1px solid var(--line-2);display:inline-flex;gap:10px;align-items:center;font-weight:600;margin-top:6px}
.cp:hover{background:var(--hover)}
.plain{padding:120px 20px;text-align:center;color:var(--text-3)}
.pop{position:absolute;z-index:20;top:62px;right:300px;width:380px;background:#0a0b0d;border:1px solid var(--line-2);border-radius:14px;padding:14px;display:none;box-shadow:0 14px 40px rgba(0,0,0,.5)}
.pop.show{display:block}
.pop .li{display:flex;align-items:center;gap:12px;padding:8px 6px;border-radius:8px;cursor:pointer}
.pop .li:hover{background:var(--hover)}
.pop .li .g{margin-left:auto;color:var(--text-3);font-family:var(--mono)}
.pop .pr{margin:10px 0 8px;background:var(--app);border-radius:10px;padding:10px 12px;color:var(--text-2);font-family:var(--mono);font-size:15px;line-height:1.45}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#000;border:1px solid var(--line-2);border-radius:12px;padding:10px 18px;display:none;z-index:30}
.toast.show{display:block}
.tip{position:absolute;display:none;z-index:40;background:#000;border:1px solid var(--line-2);border-radius:8px;padding:6px 10px;pointer-events:none}
@media (max-width:1000px){.split{grid-template-columns:1fr}.strip{grid-template-columns:repeat(3,1fr)}.rowc,.scr,.heads{grid-template-columns:1fr}.pop{right:20px}}
</style>
</head>
<body>
<div class="demo" role="group" aria-label="Mockup controls">
  <div class="row"><b>Mockup:</b><span>jump to</span><span id="presets" class="row" style="gap:6px"></span></div>
  <div class="what" id="what"></div>
</div>

<div class="app">
  <header>
    <div class="logo" aria-hidden="true">▶</div>
    <span class="crumb"><b>Lumen</b> <span class="id">qcha9rmj</span> / Lumen launch film</span>
    <span class="pill" id="stagepill">Brief</span>
    <span id="chipwrap"></span>
    <span class="sp"></span>
    <button class="ibtn" aria-label="Keyboard shortcuts" data-tip="Shortcuts · ?" id="kbd"></button>
    <button class="obtn" id="clog"></button>
    <button class="send" id="send"></button>
  </header>
  <nav class="tabs" id="tabs" aria-label="Stages"></nav>
  <div id="view"></div>
  <div class="pop" id="pop" role="dialog" aria-label="Ready to build"></div>
</div>
<div class="toast" id="toast">Copied. Paste it into your agent.</div>
<div class="tip" id="tip"></div>

<script>
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const P = {
  brief:'M9 4h6v3H9z M7 5H6a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1h-1 M9 12h6 M9 16h4',

  story:'M3 4h11v8H3z M16 4h5v8h-5z M3 14h5v6H3z M10 14h11v6H10z',
  picture:'M4 4h16v16H4z M8 4v16 M16 4v16 M4 9h4 M4 15h4 M16 9h4 M16 15h4',
  mic:'M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3z M6 11a6 6 0 0 0 12 0 M12 17v4',
  music:'M9 18V6l10-2v12 M9 18a3 3 0 1 1-6 0 3 3 0 0 1 6 0z M19 16a3 3 0 1 1-6 0 3 3 0 0 1 6 0z',
  bolt:'M13 3L5 14h6l-1 7 8-11h-6z',
  mix:'M6 4v16 M12 4v16 M18 4v16 M4 9h4 M10 15h4 M16 8h4',
  grid:'M4 4h6v6H4z M14 4h6v6h-6z M4 14h6v6H4z M14 14h6v6h-6z',
  lock:'M7 11V8a5 5 0 0 1 10 0v3 M6 11h12v9H6z',
  check:'M5 12l5 5 9-10', flag:'M6 21V4 M6 5h11l-2 4 2 4H6',
  undo:'M9 14L4 9l5-5 M4 9h10a6 6 0 0 1 0 12h-3',
  copy:'M9 9h10v11H9z M5 15V4h10', x:'M6 6l12 12 M18 6L6 18', send:'M5 12h14 M13 6l6 6-6 6',

  play:'M8 5l11 7-11 7z', back:'M15 5l-7 7 7 7', fwd:'M9 5l7 7-7 7'
};
const ic = (n, s = 20, w = 1.75) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${P[n]}"/></svg>`;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* ---------- data ---------- */
const BRIEF_CUR = { title:'Lumen launch film', purpose:'Show that Lumen finds the best takes in a folder of clips, so a first cut takes minutes, not hours.', audience:'Solo editors and small studios who cut every week.', length:30, formats:['16:9','9:16'], tone:'Calm, exact, a little dry. Closer to a product page than an advert.', include:'The eleven-minute number. The Mac download line.', avoid:'Stock footage of people at desks. The word "revolutionary".', built:'HyperFrames' };
const BRIEF_ROWS = [
  { id:'title', label:'Title', keys:['title'], kind:'line' },
  { id:'purpose', label:'Purpose', keys:['purpose'], kind:'text' },
  { id:'audience', label:'Audience', keys:['audience'], kind:'text' },
  { id:'lf', label:'Length and formats', keys:['length','formats'], kind:'lf' },
  { id:'tone', label:'Tone', keys:['tone'], kind:'text' },
  { id:'ia', label:'Include and avoid', keys:['include','avoid'], kind:'ia' },
  { id:'built', label:'Built with', keys:['built'], kind:'line' },
];
const RATIOS = { '16:9':[16,9], '9:16':[9,16], '1:1':[1,1], '4:5':[4,5] };
const SCRIPT0 = [
  { id:'S1', t:'0:00–0:03', cur:'Your footage is already shot.', dir:'', fit:.8 },
  { id:'S2', t:'0:03–0:08', cur:'Drop in a folder of clips. Lumen finds the best takes on its own.', dir:'Two short sentences. Easier to say.', fit:1 },
  { id:'S3', t:'0:14–0:18', cur:'What took six hours now takes eleven minutes.', dir:'', fit:.95 },
  { id:'S4', t:'0:20–0:25', cur:'Notes, picks and a locked cut travel with the project.', dir:'', fit:.85 },
];
const SHOTS0 = [
  { n:1, name:'Cold open', tag:'ESTABLISH', len:3, art:1, desc:'The headline sits on a pale card over a misty boat. Nothing moves except a thin progress line.' },
  { n:2, name:'Drop a folder', tag:'ACTION', len:5, art:2, desc:'A folder of clips lands in the Lumen window from the right. A count ticks up as it reads them.' },
  { n:3, name:'Best takes found', tag:'REVEAL', len:6, art:3, desc:'Thumbnails settle into a grid. One take per scene lifts and gets a soft outline.' },
  { n:4, name:'The number', tag:'PAYOFF', len:4, art:4, desc:'"11 min" fills the frame. "6 hours" sits above it, struck through and dim.' },
  { n:5, name:'Travels with it', tag:'PROOF', len:6, art:5, desc:'Notes, picks and the locked cut join as three chips, then fold into the project file.' },

      const r = BRIEF_ROWS.find((x) => x.id === rowEl.dataset.r);
      const touch = () => { if (S.briefApproved) { S.briefApproved = false; render(); return true; } rowEl.classList.toggle('changed', rowChanged(r)); $('.rv', rowEl).hidden = !rowChanged(r); $('h1.pg small', v).textContent = `${BRIEF_ROWS.length} rows${briefChanged() ? ` · ${briefChanged()} changed` : ''}`; chrome(); return false; };
      $$('[data-k]', rowEl).forEach((el) => el.oninput = () => { S.yours[el.dataset.k] = el.type === 'number' ? Number(el.value) : el.value; if (el.tagName === 'TEXTAREA') autosize(el); touch(); });
      $$('.fm', rowEl).forEach((b) => b.onclick = () => { const q = b.dataset.f, a = S.yours.formats; S.yours.formats = a.includes(q) ? a.filter((x) => x !== q) : Object.keys(RATIOS).filter((x) => a.includes(x) || x === q); if (S.briefApproved) S.briefApproved = false; render(); });
      $('.rv', rowEl).onclick = () => { r.keys.forEach((k) => S.yours[k] = JSON.parse(JSON.stringify(BRIEF_CUR[k]))); render(); };
    });
    $$('[data-rm]', v).forEach((b) => b.onclick = () => { S.refs.splice(Number(b.dataset.rm), 1); render(); });
    const ap = $('#approve'); if (ap) ap.onclick = () => { S.briefApproved = true; toast('Brief approved'); render(); };
    const un = $('#unapprove'); if (un) un.onclick = () => { S.briefApproved = false; render(); };
  }
  if (S.tab === 'script') {
    $$('.scr', v).forEach((el) => {
      const s = S.script[Number(el.dataset.i)];
      $('textarea', el).oninput = (e) => { autosize(e.target); s.yours = e.target.value; if (s.status === 'approved') { s.status = 'draft'; } el.classList.toggle('changed', scriptChanged(s)); $$('.tick', el).forEach((t) => t.classList.remove('on')); chrome(); };
      $('.dir', el).oninput = (e) => { s.dir = e.target.value; };
      $$('.tick', el).forEach((b) => b.onclick = () => { const to = b.dataset.act === 'ok' ? 'approved' : 'flagged'; s.status = s.status === to ? 'draft' : to; render(); });
    });
  }
  if (S.tab === 'story') {
    $$('.card[data-n]', v).forEach((c) => {
      c.onclick = (e) => { if (e.target.closest('[data-ck]')) return; S.sel = Number(c.dataset.n); render(); };
      c.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); S.sel = Number(c.dataset.n); render(); } };
    });
    $$('[data-ck]', v).forEach((b) => b.onclick = (e) => { e.stopPropagation(); const s = S.shots.find((x) => x.n === Number(b.dataset.ck)); s.status = s.status === 'approved' ? 'draft' : 'approved'; render(); });
    $$('[data-done]', v).forEach((b) => b.onclick = (e) => { e.stopPropagation(); const n = S.notes.find((x) => x.id === Number(b.dataset.done)); n.done = !n.done; render(); });
    $$('.note', v).forEach((el) => el.onclick = () => { S.sel = Number(el.dataset.shot); render(); });
    const go = () => { const t = $('#ncomp').value.trim(); if (!t) return; S.notes.push({ id:Date.now(), shot:S.sel, t, done:false }); render(); const nl = $('#nlist'); nl.scrollTop = nl.scrollHeight; };
    $('#ngo').onclick = go;
    $('#ncomp').onkeydown = (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); go(); } };
  }
  if (S.tab === 'picture') {
    $$('[data-done]', v).forEach((b) => b.onclick = () => { const n = S.pnotes.find((x) => x.id === Number(b.dataset.done)); n.done = !n.done; render(); });
  }
}
document.addEventListener('keydown', (e) => {
  if ((e.target.closest && e.target.closest('input,textarea')) || e.metaKey || e.ctrlKey || e.altKey) return;
  const i = '123456789'.indexOf(e.key); if (i >= 0) { S.tab = TABS[i][0]; render(); }
});

/* tooltips */
document.addEventListener('mouseover', (e) => {
  const el = e.target.closest('[data-tip]'), tip = $('#tip');
  if (!el) { tip.style.display = 'none'; return; }
  tip.textContent = el.dataset.tip; tip.style.display = 'block';
  const r = el.getBoundingClientRect();
  tip.style.left = Math.max(8, Math.min(innerWidth - tip.offsetWidth - 8, r.left + r.width / 2 - tip.offsetWidth / 2)) + 'px';
  tip.style.top = (r.bottom + scrollY + 8) + 'px';
});

$('#presets').innerHTML = PRESETS.map((p, i) => `<button data-p="${i}" aria-pressed="false">${i + 1} · ${p.name}</button>`).join('');
$$('#presets button').forEach((b) => b.onclick = () => setPreset(Number(b.dataset.p)));
setPreset(0);
</script>
</body>
