name: CI

# §19.4: every push and pull request is built, typechecked, unit tested, run through the
# browser suite in Chromium and WebKit with ffmpeg installed, and checked for what would ship.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20.19.x", "22.x"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npx vitest run

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      # Both projects, Chromium and WebKit. On Linux WebKit, tests that need H.264 playback are
      # skipped with a reason (see needsH264 in e2e/fixture.ts); every other test runs there.
      - name: Browser tests
        run: npx playwright test --retries=0

      # Evidence, not a gate: the H.264 tests in Linux WebKit as well, to find out whether
      # GStreamer here plays them. If this goes green run after run, the skip can go.
      - name: Browser tests needing H.264, in Linux WebKit (informational)
        if: matrix.node == '22.x'
        continue-on-error: true
        env:
          RUSHES_E2E_WEBKIT_H264: "1"
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-webkit-h264
        run: npx playwright test --project=webkit --retries=0 --output=test-results-webkit-h264

      # npm pack runs the prepare script (the build) first, and its output lands in pack.json
      # ahead of npm's own JSON, so the check reads from the line that opens the JSON array.
      - name: Check what would ship
        run: |
          npm pack --dry-run --json > pack.json
          node -e 'const t=require("fs").readFileSync("pack.json","utf8");const ok=["dist/","web-dist/","skills/",".claude-plugin/",".mcp.json","README.md","AGENTS.md","LICENSE","package.json"];const files=JSON.parse(t.slice(t.search(/^\[$/m)))[0].files.map(f=>f.path);const bad=files.filter(p=>!ok.some(a=>a.endsWith("/")?p.startsWith(a):p===a));if(bad.length){console.error("Not allowed in the package:\n"+bad.join("\n"));process.exit(1)}console.log(files.length+" files, all allowed")'

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-node-${{ matrix.node }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
